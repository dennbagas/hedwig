server:
  port: 8080
  healthz_path: /healthz

github:
  app_id: 123456
  installation_id: 789012
  private_key_path: ./secrets/github-app.pem
  webhook_secret: "replace-this-value" # set via APP_GITHUB_WEBHOOK_SECRET

telegram:
  enabled: true
  bot_token: "replace-this-value" # set via APP_TELEGRAM_BOT_TOKEN
  webhook_secret: "replace-this-value" # set via APP_TELEGRAM_WEBHOOK_SECRET
  webhook_path: /webhooks/telegram
  webhook_url: https://hedwig.example.com/webhooks/telegram
  chat_id: -100123456789

# Both channels are individually optional (either can be disabled/omitted);
# the only requirement is that at least one of telegram.enabled /
# slack.enabled is true.
slack:
  enabled: false
  bot_token: "replace-this-value" # set via APP_SLACK_BOT_TOKEN
  signing_secret: "replace-this-value" # set via APP_SLACK_SIGNING_SECRET
  channel_id: "C0123456789"
  webhook_path: /webhooks/slack/interactions

database:
  path: /data/hedwig.db

logging:
  level: info  # trace, debug, info, warn, error

notifications:
  templates_dir: ./templates

# Opt-in: set retry.enabled: true to add a "Retry failed jobs" button to
# workflow_run failure notifications. Defaults to false (plain messages, no
# GitHub rerun call).
retry:
  enabled: false
